[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-investment-simulator"
version = "0.4.0"
description = "Deterministic and future stochastic Caisse portfolio investment simulator"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
